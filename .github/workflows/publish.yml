name: publish
# What the run list shows: the shape of the push, not the last of its commits, which is what GitHub would
# put there by default and what made a six-commit push look like one commit's work. `commits` exists only
# on a `push`, and a missing property evaluates to an empty string, hence the `|| 0` for a manual run.
run-name: publish ${{ github.ref_name }} · ${{ github.event.commits.length || 0 }} commits · ${{ github.sha }}

# Publishes the plugins whose version is not on the registry yet. No token and no secret: npm accepts
# this workflow through OIDC, with the trusted publisher configured per package on npmjs.com.
#
# The repository holds sources: `tui.tsx`, `gui.tsx`, no compiled half and no `dist/`. The two builds and
# the manifest rewrite happen here, in the runner, because a `.tsx` inside `node_modules` is compiled by
# the host with the wrong JSX runtime and the plugin stops existing — the failure a user hit on
# 2026-10-25. So the package the registry receives is a function of a commit, produced once, on the way
# out; nothing generated is committed.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    # The manual run exists to retry a push that failed, not to publish another branch: `workflow_dispatch`
    # lets the operator pick any ref, and a run from one would ship it with none of the local gates.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # Never cache in a release build: a stale tree must not decide what ships.
          package-manager-cache: false

      - name: Install
        run: npm ci --no-audit --no-fund

      # Before any build: once a `tui.js` sits beside its `tui.tsx`, `check-source` refuses the tree, and
      # that refusal is the point of the check. `check:ci` rather than `check`: the SDK-versus-app version
      # gate needs the CLI installed, and in a runner there is no app to compare against — that gate is a
      # local developer's, the compiler is the runner's.
      - name: Check
        run: npm run check:ci

      - name: Compile the halves
        run: |
          node scripts/build-tui.mjs --out plugins
          node scripts/build-gui.mjs

      # What the registry gets is not what the repository holds: `./tui` points at the compiled file, and
      # the whitelist drops every `.tsx`. `dist/` rides along only for the packages that build a GUI half.
      - name: Rewrite the manifests
        run: |
          set -eu
          for dir in plugins/*/; do
            name=$(node -p "require('./${dir}package.json').name")
            case "$name" in @rizal72/*) ;; *) continue ;; esac
            [ -f "${dir}tui.tsx" ] || continue
            node -e '
              const fs = require("fs")
              const file = process.argv[1]
              const manifest = JSON.parse(fs.readFileSync(file, "utf8"))
              manifest.exports = { ...manifest.exports, "./tui": "./tui.js" }
              const declared = Array.isArray(manifest.files) ? manifest.files : []
              manifest.files = ["*.ts", "tui.js", "README.md", ...(declared.includes("dist") ? ["dist"] : [])]
              fs.writeFileSync(file, JSON.stringify(manifest, null, "\t") + "\n")
            ' "${dir}package.json"
          done

      - name: Publish the new versions
        run: |
          set -eu
          for dir in plugins/*/; do
            name=$(node -p "require('./${dir}package.json').name")
            version=$(node -p "require('./${dir}package.json').version")
            case "$name" in @rizal72/*) ;; *) continue ;; esac
            published=$(npm view "$name" version 2>/dev/null || echo none)
            if [ "$published" = "$version" ]; then
              echo "$name@$version is already on the registry"
              continue
            fi
            # Only forward: publishing an older number would move the `latest` tag back.
            if [ "$published" != none ] &&
               [ "$(printf '%s\n%s\n' "$published" "$version" | sort -V | tail -1)" != "$version" ]; then
              echo "$name@$version is behind the registry's $published, skipped"
              continue
            fi
            echo "publishing $name@$version (registry has $published)"
            (cd "$dir" && npm publish)
          done
